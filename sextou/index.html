<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="description" content="Seu vídeo de Sextou com a sua marca por R$ 19,90. Envie nome, logo e uma foto opcional. Receba no WhatsApp.">
  <title>Vídeo Sextou · iA4tube</title>
  <link rel="canonical" href="https://ia4tube.com/sextou/">
  <link rel="icon" type="image/png" href="/site-publico/logo-iA4tube.png">
  <link rel="stylesheet" href="./sextou.css?v=20261016-2">
  <script id="sextou-config" type="application/json">{"campaignId":"sextou-classico-v1","productName":"Vídeo Sextou personalizado","priceCents":1990,"submitEndpoint":"https://marcagrande-pedidos-wshgj6ugza-uc.a.run.app/orders","recipientWhatsApp":"554791049079"}</script>
  <script src="./app.js?v=20261016-3" defer></script>
</head>
<body>
  <main class="page">
    <header class="header"><a class="brand" href="/" aria-label="iA4tube — início"><img src="/site-publico/logo-iA4tube.png" width="32" height="32" alt=""><span>iA4tube</span></a><span class="product-name">Vídeo Sextou</span></header>
    <section class="product" aria-label="Vídeo Sextou de exemplo">
      <video controls autoplay muted loop playsinline preload="metadata" poster="./produto.png" aria-label="Exemplo do vídeo Sextou"><source src="./produto.mp4" type="video/mp4"></video>
      <div class="offer"><h1>Com a sua marca.</h1><strong id="price">R$ 19,90</strong></div>
    </section>
    <section id="pedido" aria-label="Personalizar vídeo">
      <form id="order-form" novalidate>
        <div hidden><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
        <fieldset id="form-fields">
          <legend class="sr-only">Dados da empresa</legend>
          <label for="company">Nome da empresa</label>
          <input id="company" name="company" type="text" maxlength="100" autocomplete="organization" required aria-describedby="company-error">
          <p class="error" id="company-error" hidden></p>
          <div hidden><input id="whatsapp" name="whatsapp" type="hidden"><p id="whatsapp-error" hidden></p><input type="radio" name="businessType" value="auto" checked><input type="radio" name="businessType" value="hamburgueria"><input type="radio" name="businessType" value="pizzaria"></div>
        </fieldset>
        <div class="field">
          <label for="logo">Logo da empresa</label>
          <div class="upload" id="logo-box"><input id="logo" name="logo" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" aria-required="true" aria-describedby="logo-error"><span aria-hidden="true" class="plus">+</span><span id="logo-label">Adicionar logo</span><img id="logo-preview" alt="Logo selecionada" hidden></div>
          <p class="filename" id="logo-name" hidden></p><p class="error" id="logo-error" hidden></p>
        </div>
        <div class="field">
          <div class="label-row"><label for="photo">Foto do produto <span>opcional</span></label><button class="text-button" id="remove-photo" type="button" hidden>Remover</button></div>
          <div class="upload" id="photo-box"><input id="photo" name="photos" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" aria-describedby="photo-error"><span aria-hidden="true" class="plus">+</span><span id="photo-label">Adicionar foto</span><img id="photo-preview" alt="Foto selecionada" hidden></div>
          <p class="filename" id="photo-name" hidden></p><p class="error" id="photo-error" hidden></p>
        </div>
        <fieldset id="date-options" hidden><input id="include-date" type="checkbox"><p id="date-default-help"></p><div id="date-field" hidden><input id="event-date" type="date"><p id="event-date-error" hidden></p></div></fieldset>
        <p class="error notice" id="form-message" role="alert" tabindex="-1" hidden></p><p class="notice" id="restore-message" role="status" hidden></p>
        <button class="primary" id="submit-button" type="submit"><span id="submit-label">Enviar pedido</span><span aria-hidden="true">↗</span></button>
        <p class="delivery">Receba seu vídeo no WhatsApp.</p>
      </form>
      <section id="receipt" aria-labelledby="receipt-title" tabindex="-1" hidden>
        <h2 id="receipt-title">Pedido salvo ✓</h2>
        <dl><div><dt>Pedido</dt><dd id="receipt-number"></dd></div><div><dt>Empresa</dt><dd id="receipt-company"></dd></div><div><dt>Valor</dt><dd id="receipt-price"></dd></div></dl>
        <a class="primary" id="whatsapp-link" rel="noreferrer">Continuar no WhatsApp ↗</a>
        <p class="delivery">Envie a mensagem para combinar a entrega.</p>
        <button class="secondary" type="button" id="copy-message">Copiar mensagem</button><p id="copy-status" class="notice" role="status"></p>
        <details class="message-details"><summary>Ver mensagem</summary><textarea id="saved-message" readonly rows="8" aria-label="Mensagem para copiar e enviar no WhatsApp"></textarea></details>
        <a id="receipt-link" target="_blank" rel="noopener noreferrer" hidden>Ver pedido</a><button class="new-order" type="button" id="new-order">Novo pedido</button>
      </section>
      <noscript>Ative o JavaScript para enviar o pedido.</noscript>
    </section>
    <footer><a href="/politica-de-privacidade/" target="_blank" rel="noopener">Privacidade</a></footer>
  </main>
</body>
</html>
